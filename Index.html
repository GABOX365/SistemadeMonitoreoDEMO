<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Monitoreo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    
</head>
<body>
  <div class="login-page-container">
  <div class="login-page-card">
    <div class="login-page-header">
      <h2>Sistema de Monitoreo</h2>
      <p>Ingrese sus credenciales para continuar</p>
    </div>
    <div class="login-page-body">
      <form id="loginForm">
        <div class="login-page-form-group">
          <label for="username">Usuario</label>
          <input type="text" class="login-page-form-control" id="username" required>
        </div>
        <div class="login-page-form-group">
          <label for="password">Contraseña</label>
          <input type="password" class="login-page-form-control" id="password" required>
        </div>
        <button type="submit" class="login-page-btn">Ingresar</button>
        <div id="errorMessage" class="login-page-error"></div>
      </form>
    </div>
    <div class="login-page-footer">
      <p>Sistema de Monitoreo © 2025</p>
    </div>
  </div>
</div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Credenciales hardcodeadas (solo para demostración)
            const validCredentials = [
                { user: 'admin', pass: 'admin123' },
                { user: 'operador', pass: 'operador123' }
            ];
            
            // Verificar credenciales
            const isValid = validCredentials.some(cred => cred.user === username && cred.pass === password);
            
            if (isValid) {
                // Guardar estado de login en localStorage
                localStorage.setItem('isAuthenticated', 'true');
                localStorage.setItem('currentUser', username);
                
                // Redirigir al dashboard
                window.location.href = 'dashboard.html';
            } else {
                // Mostrar mensaje de error
                const errorElement = document.getElementById('errorMessage');
                errorElement.textContent = 'Usuario o contraseña incorrectos';
                errorElement.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
